[project]
name = "decision-helper-mcp"
version = "0.1.0"
description = "提供掷骰子、随机抽取与选项洗牌的无状态 MCP 服务"
requires-python = ">=3.10"
dependencies = ["mcp>=1.26,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_helper_mcp"]
